<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Outfit:wght@500;700;900&amp;display=swap');
      .title-main {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #f8fafc;
      }
      .title-script {
        font-family: 'Caveat', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive;
        font-size: 58px;
        font-weight: 700;
        font-style: italic;
      }
      .tagline {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 1.5px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="scriptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Plate with Rounded Corners & Glow Border -->
  <rect x="10" y="10" width="900" height="220" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Subtle Ambient Glows -->
  <rect x="10" y="10" width="900" height="220" rx="22" fill="url(#glowCyan)"/>
  <rect x="10" y="10" width="900" height="220" rx="22" fill="url(#glowPurple)"/>

  <!-- ECG / Vital Pulse Line Background Graphic -->
  <path d="M 40 120 L 140 120 L 160 95 L 175 145 L 195 70 L 215 160 L 235 110 L 250 125 L 265 120 L 880 120" 
        fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Glowing Pulse Segment -->
  <path d="M 140 120 L 160 95 L 175 145 L 195 70 L 215 160 L 235 110 L 250 125 L 265 120" 
        fill="none" stroke="url(#titleGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <circle cx="195" cy="70" r="4.5" fill="#38bdf8"/>
  <circle cx="195" cy="70" r="9" fill="#38bdf8" opacity="0.25"/>

  <!-- Title Center Group -->
  <g transform="translate(460, 84)" text-anchor="middle">
    <!-- "MEDAI" Text -->
    <text x="-95" y="0" class="title-main">
      MED<tspan fill="url(#titleGrad)">AI</tspan>
    </text>

    <!-- "Backend" Script Text -->
    <text x="105" y="2" class="title-script" fill="url(#scriptGrad)">
      Backend
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(460, 126)" text-anchor="middle">
    <text class="tagline">
      ✨ Intelligent Medical Adherence &amp; Caregiver Monitoring Engine ✨
    </text>
  </g>

  <!-- Pill Badges inside Banner -->
  <g transform="translate(460, 175)" text-anchor="middle">
    <!-- Badge 1: Django 6.1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#092e20" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
      <text y="4" class="pill-text" fill="#34d399">⚡ Django 6.1</text>
    </g>

    <!-- Badge 2: DRF & SimpleJWT -->
    <g transform="translate(-80, 0)">
      <rect x="-72" y="-14" width="144" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
      <text y="4" class="pill-text" fill="#a5b4fc">🔐 DRF &amp; JWT</text>
    </g>

    <!-- Badge 3: MySQL & SQLite -->
    <g transform="translate(80, 0)">
      <rect x="-68" y="-14" width="136" height="28" rx="14" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2" opacity="0.95"/>
      <text y="4" class="pill-text" fill="#38bdf8">🗄️ MySQL / SQLite</text>
    </g>

    <!-- Badge 4: Adherence AI -->
    <g transform="translate(240, 0)">
      <rect x="-72" y="-14" width="144" height="28" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
      <text y="4" class="pill-text" fill="#e879f9">📊 Adherence AI</text>
    </g>
  </g>
</svg>
